name: AI Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1-5'

jobs:
  scanner:
    name: Run AI Smart Scanner
    runs-on: ubuntu-latest

    # Allow the scheduler to remain active throughout the trading session.
    timeout-minutes: 420

    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Google Sheet webhook
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SHEET_WEBHOOK_URL:-}" ]; then
            echo "::warning::GOOGLE_SHEET_WEBHOOK_URL secret is missing."
            echo "Continuing to scanner..."
            exit 0
          fi

          echo "Checking Google Sheet V9 webhook..."

          RESPONSE=$(curl \
            -L \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            "$GOOGLE_SHEET_WEBHOOK_URL" 2>&1) || true

          echo "Webhook response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | jq -e \
            '.success == true and
             (.version == "V9" or .version == "v9") and
             (.status == "RUNNING" or .status == "running")' \
            >/dev/null 2>&1
          then
            echo "Google Sheet V9 webhook verified."
          else
            echo "::warning::Google Sheet webhook verification failed or timed out."
            echo "This verification failure will NOT stop the scanner."
          fi

      - name: Run AI Smart Scanner
        id: scanner
        continue-on-error: true
        run: npm start

      - name: Scanner result
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "       AI SMART SCANNER RESULT"
          echo "========================================"

          if [ "${{ steps.scanner.outcome }}" = "success" ]; then
            echo "Scanner completed successfully."
          else
            echo "Scanner completed with errors or partial failures."
            echo "Review the scanner output above."
          fi

          echo "========================================"

      - name: Complete workflow
        if: always()
        run: |
          echo "AI Scanner workflow completed."
          exit 0
