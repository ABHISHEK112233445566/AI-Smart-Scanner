name: AI Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1-5'

jobs:
  scanner:
    name: Run AI Smart Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Google Sheet webhook
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SHEET_WEBHOOK_URL:-}" ]; then
            echo "ERROR: GOOGLE_SHEET_WEBHOOK_URL secret is missing."
            exit 1
          fi

          echo "Checking Google Sheet webhook..."

          SUCCESS=0

          for attempt in 1 2 3 4 5; do
            echo "Webhook check attempt $attempt/5..."

            RESPONSE=$(curl \
              --location \
              --silent \
              --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              --retry 2 \
              --retry-delay 3 \
              --retry-all-errors \
              "$GOOGLE_SHEET_WEBHOOK_URL" 2>&1) && SUCCESS=1 || SUCCESS=0

            echo "Response:"
            echo "$RESPONSE"

            if [ "$SUCCESS" -eq 1 ]; then
              if echo "$RESPONSE" | jq -e '
                .success == true
                and .status == "RUNNING"
              ' >/dev/null 2>&1; then
                echo "Google Sheet webhook is reachable."
                SUCCESS=2
                break
              fi
            fi

            echo "Webhook check failed. Waiting before retry..."
            sleep 5
          done

          if [ "$SUCCESS" -ne 2 ]; then
            echo ""
            echo "ERROR: Google Sheet webhook could not be verified."
            echo "Check the GOOGLE_SHEET_WEBHOOK_URL GitHub secret."
            exit 1
          fi

      - name: Run AI Smart Scanner
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting AI Smart Scanner..."

          npm start
