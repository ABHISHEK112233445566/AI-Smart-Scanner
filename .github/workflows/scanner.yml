name: AI Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1-5'

jobs:
  scanner:
    name: Run AI Smart Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Google Sheet V9 webhook
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SHEET_WEBHOOK_URL:-}" ]; then
            echo "ERROR: GOOGLE_SHEET_WEBHOOK_URL secret is missing."
            exit 1
          fi

          RESPONSE=$(curl -L --fail --silent --show-error --max-time 30 "$GOOGLE_SHEET_WEBHOOK_URL")
          echo "$RESPONSE"

          if ! echo "$RESPONSE" | jq -e '.success == true and .version == "V9" and .status == "RUNNING"' >/dev/null; then
            echo "ERROR: Google Sheet V9 webhook verification failed."
            exit 1
          fi

          echo "Google Sheet V9 webhook verified."

      - name: Run AI Smart Scanner
        run: npm start
