name: AI Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1-5'

jobs:
  scanner:
    name: Run AI Smart Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Google Sheet webhook
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SHEET_WEBHOOK_URL:-}" ]; then
            echo "ERROR: GOOGLE_SHEET_WEBHOOK_URL secret is missing."
            exit 1
          fi

          echo "Checking Google Sheet webhook..."

          SUCCESS=false

          for ATTEMPT in 1 2 3 4 5
          do
            echo "Webhook check attempt $ATTEMPT/5..."

            RESPONSE=$(curl \
              -L \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              "$GOOGLE_SHEET_WEBHOOK_URL" 2>&1) || true

            echo "Webhook response:"
            echo "$RESPONSE"

            if echo "$RESPONSE" | jq -e \
              '.success == true and
               (.version == "V9" or .version == "v9") and
               (.status == "RUNNING" or .status == "running")' \
              >/dev/null 2>&1
            then
              SUCCESS=true
              echo "Google Sheet V9 webhook verified."
              break
            fi

            if [ "$ATTEMPT" -lt 5 ]; then
              echo "Webhook not ready. Waiting 10 seconds..."
              sleep 10
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::warning::Google Sheet webhook verification failed after 5 attempts."
            echo "::warning::The scanner will still run. Google Sheet update errors will be reported by the scanner."
          fi

      - name: Run AI Smart Scanner
        id: scanner
        continue-on-error: true
        run: npm start

      - name: Scanner result
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "       GITHUB SCANNER RESULT"
          echo "========================================"

          if [ "${{ steps.scanner.outcome }}" = "success" ]; then
            echo "Scanner completed successfully."
          else
            echo "Scanner completed with warnings/errors."
            echo "Check the scanner output above for the exact Google Sheets failure."
          fi

          echo "========================================"

      - name: Finish workflow
        if: always()
        shell: bash
        run: |
          echo "AI Scanner workflow finished."
          exit 0
