name: AI Scanner

on:
  workflow_dispatch:

  schedule:
    # 09:10 IST = 03:40 UTC
    - cron: '40 3 * * 1-5'

# Only one scanner run may execute at a time. A newer manual/scheduled run
# replaces an older queued/in-progress run instead of waiting behind it.
concurrency:
  group: ai-smart-scanner-production
  cancel-in-progress: true

jobs:
  scanner:
    name: Run AI Smart Scanner
    runs-on: ubuntu-latest

    # GitHub Actions performs ONE complete scan and then exits.
    # The 30-minute scheduler is not used inside GitHub Actions.
    timeout-minutes: 30

    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      SCANNER_SCHEDULER_ENABLED: 'false'

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "     VERIFY SCANNER CONFIGURATION"
          echo "========================================"
          if [ -z "${UPSTOX_ACCESS_TOKEN:-}" ]; then
            echo "::error::UPSTOX_ACCESS_TOKEN secret is missing."
            exit 1
          fi
          echo "UPSTOX_ACCESS_TOKEN: OK"
          if [ -z "${GOOGLE_SHEET_WEBHOOK_URL:-}" ]; then
            echo "::error::GOOGLE_SHEET_WEBHOOK_URL secret is missing."
            exit 1
          fi
          echo "GOOGLE_SHEET_WEBHOOK_URL: OK"
          echo "========================================"
          echo "Configuration verified."
          echo "========================================"

      - name: Run AI Smart Scanner once
        id: scanner
        run: npm run scan-once

      - name: Scanner result
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "       AI SMART SCANNER RESULT"
          echo "========================================"
          if [ "${{ steps.scanner.outcome }}" = "success" ]; then
            echo "Scanner completed successfully."
          else
            echo "::error::Scanner failed."
            echo "Check the scanner logs above."
          fi
          echo "========================================"

      - name: Complete workflow
        if: always()
        run: echo "AI Scanner workflow finished."
