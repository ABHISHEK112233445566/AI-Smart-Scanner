name: AI Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1-5'

jobs:
  scanner:
    name: Run AI Smart Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 420

    # SAME secrets for:
    # 1. Mobile/manual Run workflow
    # 2. Scheduled workflow
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ============================================================
      # VERIFY REQUIRED SECRETS
      # ============================================================
      - name: Verify scanner configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "     VERIFY SCANNER CONFIGURATION"
          echo "========================================"

          if [ -z "${UPSTOX_ACCESS_TOKEN:-}" ]; then
            echo "::error::UPSTOX_ACCESS_TOKEN is missing."
            echo "The scanner cannot run without the Upstox token."
            exit 1
          fi

          echo "✅ UPSTOX_ACCESS_TOKEN is available."

          if [ -z "${GOOGLE_SHEET_WEBHOOK_URL:-}" ]; then
            echo "::error::GOOGLE_SHEET_WEBHOOK_URL is missing."
            echo "Google Sheets cannot be updated without the webhook URL."
            exit 1
          fi

          echo "✅ GOOGLE_SHEET_WEBHOOK_URL is available."

          echo "========================================"
          echo "Secrets/configuration verified."
          echo "========================================"

      # ============================================================
      # VERIFY GOOGLE SHEET WEBHOOK
      # ============================================================
      - name: Verify Google Sheet webhook
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Google Sheet V9 webhook..."

          RESPONSE=$(curl \
            -L \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            "$GOOGLE_SHEET_WEBHOOK_URL")

          echo "Webhook response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | jq -e \
            '.success == true and
             (.version == "V9" or .version == "v9") and
             (.status == "RUNNING" or .status == "running")' \
             >/dev/null 2>&1
          then
            echo "✅ Google Sheet V9 webhook verified."
          else
            echo "::error::Google Sheet webhook verification failed."
            echo "Scanner will NOT start."
            exit 1
          fi

      # ============================================================
      # RUN SCANNER
      # ============================================================
      - name: Run AI Smart Scanner
        id: scanner
        run: npm start

      # ============================================================
      # RESULT
      # ============================================================
      - name: Scanner result
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "       AI SMART SCANNER RESULT"
          echo "========================================"

          if [ "${{ steps.scanner.outcome }}" = "success" ]; then
            echo "✅ Scanner completed successfully."
          else
            echo "❌ Scanner failed."
            echo "Review the scanner output above."
          fi

          echo "========================================"

      - name: Complete workflow
        if: always()
        run: |
          echo "AI Scanner workflow completed."
