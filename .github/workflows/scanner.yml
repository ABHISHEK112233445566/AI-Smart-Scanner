name: AI Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1-5'

jobs:
  scanner:
    name: Run AI Smart Scanner
    runs-on: ubuntu-latest

    # Scheduler runs every 30 minutes.
    # Give it enough time to stay alive during the trading session.
    timeout-minutes: 420

    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "     VERIFY SCANNER CONFIGURATION"
          echo "========================================"

          if [ -z "${UPSTOX_ACCESS_TOKEN:-}" ]; then
            echo "::error::UPSTOX_ACCESS_TOKEN secret is missing."
            exit 1
          fi

          echo "✅ UPSTOX_ACCESS_TOKEN available."

          if [ -z "${GOOGLE_SHEET_WEBHOOK_URL:-}" ]; then
            echo "::error::GOOGLE_SHEET_WEBHOOK_URL secret is missing."
            exit 1
          fi

          echo "✅ GOOGLE_SHEET_WEBHOOK_URL available."

          echo "========================================"
          echo "Configuration verified."
          echo "Starting scanner..."
          echo "========================================"

      - name: Run AI Smart Scanner
        id: scanner
        run: npm start

      - name: Scanner result
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "       AI SMART SCANNER RESULT"
          echo "========================================"

          if [ "${{ steps.scanner.outcome }}" = "success" ]; then
            echo "✅ Scanner completed successfully."
          else
            echo "❌ Scanner failed."
            echo "Review the scanner output above."
          fi

          echo "========================================"

      - name: Complete workflow
        if: always()
        run: |
          echo "AI Scanner workflow completed."
