name: AI Smart Scanner

on:
  workflow_dispatch:

  schedule:
    # 09:15, 09:45, 10:15, 10:45 ... 14:45 IST
    - cron: "15,45 3-8 * * 1-5"

    # 15:15 IST
    - cron: "45 9 * * 1-5"

jobs:
  scanner:
    runs-on: ubuntu-latest

    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI Smart Scanner
        run: npm start
