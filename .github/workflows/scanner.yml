name: AI Scanner

on:
  workflow_dispatch:

  push:
    branches:
      - scanner-fix-test

  schedule:
    # 09:10 IST = 03:40 UTC
    - cron: '40 3 * * 1-5'

jobs:
  scanner:
    name: Run AI Smart Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 420

    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}

    steps:
      - name: Checkout scanner
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UPSTOX_ACCESS_TOKEN:-}" ]; then
            echo "::error::UPSTOX_ACCESS_TOKEN secret is missing."
            exit 1
          fi
          echo "UPSTOX_ACCESS_TOKEN: OK"
          if [ -z "${GOOGLE_SHEET_WEBHOOK_URL:-}" ]; then
            echo "::error::GOOGLE_SHEET_WEBHOOK_URL secret is missing."
            exit 1
          fi
          echo "GOOGLE_SHEET_WEBHOOK_URL: OK"

      - name: Run AI Smart Scanner
        id: scanner
        run: npm start

      - name: Scanner result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.scanner.outcome }}" = "success" ]; then
            echo "Scanner completed successfully."
          else
            echo "::error::Scanner failed. Check the scanner logs above."
          fi

      - name: Complete workflow
        if: always()
        run: echo "AI Scanner workflow finished."
