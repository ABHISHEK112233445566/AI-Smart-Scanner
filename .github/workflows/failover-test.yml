name: V4 Failover Test

on:
  push:
    branches: [scanner-v4-redesign]
  workflow_dispatch:

jobs:
  failover-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run failover test
        run: node test/failoverBroker.test.js
