name: New Scanner Publish (Development)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-scanner-development-publish
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and publish new scanner
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      BROKER: UPSTOX
    steps:
      - name: Checkout selected development branch
        uses: actions/checkout@v5
        with:
          ref: development/new-options-scanner-2026-11-10
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run new scanner validation tests
        run: npm run test:new-scanner
      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UPSTOX_ACCESS_TOKEN:-}" || { echo "::error::UPSTOX_ACCESS_TOKEN is missing"; exit 1; }
          test -n "${GOOGLE_SHEET_WEBHOOK_URL:-}" || { echo "::error::GOOGLE_SHEET_WEBHOOK_URL is missing"; exit 1; }
          echo "Required credentials are configured."
      - name: Run new scanner and publish to Google Sheets
        id: scanner
        run: npm run new-scan-once
      - name: Confirm publication summary
        if: always()
        run: |
          echo "New scanner workflow outcome: ${{ steps.scanner.outcome }}"
          if [ "${{ steps.scanner.outcome }}" != "success" ]; then
            echo "::error::New scanner did not complete and confirm all Google Sheets writes."
            exit 1
          fi
